<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리의 첫 웹사이트</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="label">MY FIRST WEBSITE</p>
      <h1>우리의 첫 웹사이트</h1>
      <p class="subtitle">GitHub Pages로 배포한 정적 웹페이지입니다.</p>
    </section>

    <section class="section">
      <h2>페이지 소개</h2>
      <p>
        HTML로 내용을 작성하고, CSS로 화면을 꾸미고,
        JavaScript로 간단한 버튼 기능을 구현했습니다.
      </p>

      <div class="cards">
        <article class="card">
          <strong>HTML</strong>
          <span>페이지 내용</span>
        </article>
        <article class="card">
          <strong>CSS</strong>
          <span>페이지 디자인</span>
        </article>
        <article class="card">
          <strong>JavaScript</strong>
          <span>버튼 동작</span>
        </article>
      </div>
    </section>

    <section class="section cheer-section">
      <h2>응원하기</h2>
      <p id="count" aria-live="polite">응원 0회</p>
      <button id="cheer" type="button">응원하기</button>
      <p class="note">새로고침하면 응원 수는 0으로 돌아갑니다.</p>
    </section>
  </main>
</body>
</html>
